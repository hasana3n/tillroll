name: Bug report
description: Something prints wrong, crashes, or doesn't connect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. Screenshots help a lot.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How was the job sent?
      options:
        - TCP/IP
        - Serial
        - Bluetooth (Android / SPP)
        - Bluetooth LE (iPhone / BLE)
        - Browser (Web Serial / WebUSB / relay)
        - Test print panel
        - Monitor
        - Library (my own code)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Ubuntu 24.04, macOS 15, Chrome 130
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tillroll version
      placeholder: e.g. 1.0.0, or a commit if you built it yourself
    validations:
      required: true
  - type: textarea
    id: bytes
    attributes:
      label: ESC/POS bytes or log
      description: |
        Start Tillroll with ESCPOS_DEBUG_DUMP=1 and attach last_escpos_receive.txt (and last_ticket.bin for large
        jobs). For crashes, attach the log (%LOCALAPPDATA%\Tillroll\logs\app.log on Windows,
        ~/.local/share/Tillroll/logs/app.log on Linux). Remove any personal data first.
