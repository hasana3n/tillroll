name: Wiki

# Publishes docs/ to the GitHub wiki whenever it changes on main. docs/ is the source of truth: edit the
# pages there, not in the wiki, because each sync overwrites the wiki (see scripts/docs-to-wiki.sh).
#
# Opt-in: GitHub creates a wiki's repository only when its first page is saved in the web UI. Create any page
# once, then set the repository variable PUBLISH_WIKI to "true".

on:
  push:
    branches: [main]
    paths: ['docs/*.md', 'scripts/docs-to-wiki.sh', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PUBLISH_WIKI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Copy docs into the wiki
        run: bash scripts/docs-to-wiki.sh docs wiki "$GITHUB_REPOSITORY"

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync from docs/ at ${GITHUB_SHA::7}"
          git push
