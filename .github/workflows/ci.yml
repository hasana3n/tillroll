name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The browser (WASM) head needs the wasm-tools workload to build.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Tillroll.slnx

      - name: Build
        run: dotnet build Tillroll.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Tillroll.slnx -c Release --no-build

      # The Linux Bluetooth servers talk to BlueZ over D-Bus. These tests run them against a fake bluetoothd
      # (tests/.../Linux/FakeBlueZ.cs) on a private session bus, including handing an RFCOMM-like socket over
      # Unix fd passing. No Bluetooth hardware needed.
      - name: Bluetooth (BlueZ) tests against a fake bluetoothd
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dbus
          ESCPOS_BT_FAKE_BLUEZ=1 dbus-run-session -- dotnet test tests/Tillroll.Transports.Bluetooth.Tests -c Release --no-build

      - name: Pack libraries
        run: dotnet pack Tillroll.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: warn
