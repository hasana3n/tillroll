name: Release

# Builds self-contained desktop apps for Windows, Linux and macOS, packs the NuGet libraries, and
# publishes everything to a GitHub Release. Trigger by pushing a tag like `v1.2.3`, or run manually
# (workflow_dispatch) to just build artifacts.
#
# Publishing the libraries is opt-in: set the repository variable PUBLISH_NUGET to "true" (and the
# NUGET_USER secret for nuget.org trusted publishing). Until then only the apps are released.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and Linux ship one portable executable (runtime and native libraries inside); macOS ships a
          # .app bundle built from the usual folder output.
          - { rid: win-x64,   os: ubuntu-latest, kind: zip,   publish: "-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded" }
          - { rid: linux-x64, os: ubuntu-latest, kind: targz, publish: "-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=embedded" }
          - { rid: osx-x64,   os: macos-latest,  kind: app,   publish: "-p:PublishSingleFile=false" }
          - { rid: osx-arm64, os: macos-latest,  kind: app,   publish: "-p:PublishSingleFile=false" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: ver
        shell: bash
        run: |
          VER=1.0.0
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained)
        run: >
          dotnet publish src/Tillroll.App.Desktop/Tillroll.App.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          ${{ matrix.publish }}
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Add the licences beside the app
        if: matrix.kind != 'app'
        run: cp LICENSE THIRD-PARTY-NOTICES.md publish/${{ matrix.rid }}/

      - name: Package — zip (Windows)
        if: matrix.kind == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../Tillroll-${{ matrix.rid }}.zip .

      - name: Package — tar.gz (Linux)
        if: matrix.kind == 'targz'
        run: |
          chmod +x publish/${{ matrix.rid }}/Tillroll
          tar -czf Tillroll-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Package — .app bundle (macOS)
        if: matrix.kind == 'app'
        run: |
          chmod +x scripts/make-macos-app.sh
          scripts/make-macos-app.sh publish/${{ matrix.rid }} dist "${{ steps.ver.outputs.version }}"
          ditto -c -k --keepParent dist/Tillroll.app Tillroll-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            Tillroll-${{ matrix.rid }}.zip
            Tillroll-${{ matrix.rid }}.tar.gz
          if-no-files-found: ignore

  pack:
    name: Pack NuGet libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: ver
        shell: bash
        run: |
          VER=1.0.0
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # The packable libraries don't need the browser head, so pack each individually (no wasm workload).
      - name: Pack
        shell: bash
        run: |
          for proj in Abstractions Core Rendering.Skia Rendering.ImageSharp Transports Transports.Bluetooth Controls; do
            dotnet pack "src/Tillroll.$proj/Tillroll.$proj.csproj" \
              -c Release -p:Version=${{ steps.ver.outputs.version }} -o packages
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            packages/*.nupkg
            packages/*.snupkg

  publish-nuget:
    name: Publish to NuGet.org
    needs: pack
    runs-on: ubuntu-latest
    # Only publish for real version tags (v*), never on a manual workflow_dispatch dry run, and only once the
    # repository opts in (variable PUBLISH_NUGET = true).
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_NUGET == 'true'
    # Scopes the OIDC token to this environment; also lets you add a manual approval gate in
    # Settings → Environments → release before anything reaches nuget.org.
    environment: release
    permissions:
      id-token: write   # required: mints the GitHub OIDC token for NuGet Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: packages

      # Exchanges the GitHub OIDC token for a short-lived (1 h) nuget.org API key. No stored key.
      # NUGET_USER is your nuget.org profile name (NOT your email); set it as a repo/environment secret.
      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing *.nupkg also pushes each matching *.snupkg symbol package automatically.
      - name: Push packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: pack
    runs-on: ubuntu-latest
    # Real version tags only. nuget.org stays the main feed; this mirror is what lists the packages
    # in the repository's "Packages" sidebar (linked through the RepositoryUrl in each .nuspec).
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_NUGET == 'true'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: packages

      # GitHub Packages has no symbol server, so push only the .nupkg files.
      - name: Push packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --no-symbols
          --skip-duplicate

  release:
    name: Create GitHub Release
    needs: [build, pack]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/Tillroll-*.zip
            artifacts/*/Tillroll-*.tar.gz
          # Notes come from CHANGELOG.md, written into the release by hand; don't overwrite them.
          generate_release_notes: false
          fail_on_unmatched_files: false
