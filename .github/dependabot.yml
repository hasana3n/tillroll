version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
    ignore:
      # From ImageSharp 3.2 / ImageSharp.Drawing 2.2 the Six Labors packages need a licence key to build.
      # Stay on the last versions that don't (ImageSharp 3.1.x and 2.1.x, ImageSharp.Drawing 2.1.x).
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">= 3.2.0"]
      - dependency-name: "SixLabors.ImageSharp.Drawing"
        versions: [">= 2.2.0"]
      # Avalonia pins SkiaSharp and HarfBuzzSharp; move to a new major only together with Avalonia.
      - dependency-name: "SkiaSharp*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "HarfBuzzSharp*"
        update-types: ["version-update:semver-major"]
      # Avalonia.Headless.XUnit is built on xunit v3 3.x, and xunit v3 4 needs a move to Microsoft.Testing.Platform.
      - dependency-name: "xunit.v3*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
