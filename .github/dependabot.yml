version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
    ignore:
      # ImageSharp 4 / ImageSharp.Drawing 3 need a Six Labors licence key to build; stay on the current majors.
      - dependency-name: "SixLabors.*"
        update-types: ["version-update:semver-major"]
      # Avalonia pins SkiaSharp and HarfBuzzSharp; move to a new major only together with Avalonia.
      - dependency-name: "SkiaSharp*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "HarfBuzzSharp*"
        update-types: ["version-update:semver-major"]
      # Avalonia.Headless.XUnit is built on xunit v3 3.x, and xunit v3 4 needs a move to Microsoft.Testing.Platform.
      - dependency-name: "xunit.v3*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
